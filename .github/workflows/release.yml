name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "版本更新类型：major=大版本，minor=小版本，patch=小小版本"
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major
      prerelease:
        description: "是否标记为预发布版本"
        required: true
        type: boolean
        default: false

  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare release PR
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Fetch tags
        run: git fetch --force --tags origin

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate release branch
        run: |
          set -euo pipefail

          if [ "${GITHUB_REF_NAME}" != "main" ]; then
            echo "Release workflow must be run from the main branch." >&2
            exit 1
          fi

      - name: Calculate version
        id: release
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          set -euo pipefail

          if ! [[ "${BUMP}" =~ ^(patch|minor|major)$ ]]; then
            echo "Invalid bump: ${BUMP}" >&2
            exit 1
          fi

          PREVIOUS_TAG="$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null || true)"

          npm version "${BUMP}" --no-git-tag-version

          VERSION="$(node -p "require('./package.json').version")"
          TAG="v${VERSION}"
          export VERSION

          node -e "const fs = require('fs'); const version = process.env.VERSION; const path = 'src/lib/version.ts'; const source = fs.readFileSync(path, 'utf8'); const next = source.replace(/export const VERSION = '[^']+';/, \`export const VERSION = '\${version}';\`); if (source === next) { throw new Error('VERSION constant was not found'); } fs.writeFileSync(path, next);"

          if git rev-parse "${TAG}" >/dev/null 2>&1; then
            echo "Git tag already exists: ${TAG}" >&2
            exit 1
          fi

          node --input-type=module <<'NODE'
          const response = await fetch(`https://registry.npmjs.org/qiniu-coding-helper/${process.env.VERSION}`, {
            signal: AbortSignal.timeout(30000),
          });
          if (response.status !== 404) {
            throw new Error(response.ok ? 'npm version already exists' : `npm registry lookup failed: HTTP ${response.status}`);
          }
          NODE

          {
            echo "previous_tag=${PREVIOUS_TAG}"
            echo "version=${VERSION}"
            echo "tag=${TAG}"
          } >> "${GITHUB_OUTPUT}"

          echo "Previous tag: ${PREVIOUS_TAG:-<none>}"
          echo "Next tag: ${TAG}"

      - name: Update CHANGELOG
        uses: actions/github-script@v8
        env:
          VERSION: ${{ steps.release.outputs.tag }}
          PREVIOUS_TAG: ${{ steps.release.outputs.previous_tag }}
        with:
          script: |
            const fs = require("fs");
            const { owner, repo } = context.repo;
            const version = process.env.VERSION;
            const previousTag = process.env.PREVIOUS_TAG || undefined;

            const params = {
              owner,
              repo,
              tag_name: version,
              target_commitish: context.sha,
            };
            if (previousTag) {
              params.previous_tag_name = previousTag;
            }

            const generated = await github.rest.repos.generateReleaseNotes(params);
            const { completeReleaseNotes } = require('./.github/scripts/release-notes.cjs');
            const notes = await completeReleaseNotes({ github, context,
              body: generated.data.body, previousTag, targetSha: context.sha });

            function formatChangelogBody(body) {
              return body
                .replace(/^## What's Changed$/gm, "### 更新内容")
                .replace(/^## New Contributors$/gm, "### 新贡献者")
                .replace(/^\*{1,2}Full Changelog\*{1,2}: (.+)$/gm, "**完整变更记录**：$1")
                .trim();
            }

            const changelogPath = "CHANGELOG.md";
            const changelog = fs.readFileSync(changelogPath, "utf8");
            const today = new Date().toISOString().slice(0, 10);
            const versionNumber = version.replace(/^v/, "");
            const entry = [
              `## [${versionNumber}] - ${today}`,
              "",
              formatChangelogBody(notes),
              "",
            ].join("\n");
            const next = changelog.replace(
              /(and this project adheres to \[Semantic Versioning\]\(https:\/\/semver\.org\/\)\.\n)/,
              `$1\n${entry}`,
            );

            if (next === changelog) {
              throw new Error("CHANGELOG insertion point was not found");
            }

            fs.writeFileSync(changelogPath, next);

      - name: Test
        run: pnpm run --if-present test

      - name: Build
        run: pnpm build

      - name: Verify CLI
        run: |
          VERSION_OUTPUT="$(node dist/cli.js --version)"
          if [ "${VERSION_OUTPUT}" != "${{ steps.release.outputs.version }}" ]; then
            echo "Unexpected CLI version: ${VERSION_OUTPUT}" >&2
            exit 1
          fi
          node dist/cli.js --help

      - name: Verify npm package contents
        run: npm pack --dry-run

      - name: Create release PR
        uses: actions/github-script@v8
        env:
          VERSION: ${{ steps.release.outputs.version }}
          PRERELEASE: ${{ inputs.prerelease }}
        with:
          script: |
            const { openReleasePr } = require('./.github/scripts/release.cjs');
            const pr = await openReleasePr({ github, context, version: process.env.VERSION,
              prerelease: process.env.PRERELEASE === 'true' });
            await core.summary.addHeading('Release PR ready for review')
              .addLink('Review and merge to publish', pr.html_url).write();

  publish:
    name: Publish merged release PR
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.event.pull_request.head.ref, 'release/v') &&
      contains(github.event.pull_request.labels.*.name, 'release')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
      id-token: write
    steps:
      - name: Checkout merged release
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0

      - name: Validate release PR
        id: release
        uses: actions/github-script@v8
        with:
          script: |
            const { validateReleasePr } = require('./.github/scripts/release.cjs');
            const release = await validateReleasePr({ github, context });
            for (const [key, value] of Object.entries(release)) core.setOutput(key, value);

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test and build
        run: pnpm test

      - name: Verify CLI and npm package
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          test "$(node dist/cli.js --version)" = "$VERSION"
          node dist/cli.js --help
          npm pack --dry-run

      - name: Check published version
        id: npm
        uses: actions/github-script@v8
        env:
          VERSION: ${{ steps.release.outputs.version }}
        with:
          script: |
            const { checkPublishedVersion } = require('./.github/scripts/release.cjs');
            core.setOutput('published', await checkPublishedVersion({ github, context,
              version: process.env.VERSION }));

      - name: Create release tag
        uses: actions/github-script@v8
        env:
          VERSION: ${{ steps.release.outputs.version }}
        with:
          script: |
            const { ensureTag } = require('./.github/scripts/release.cjs');
            await ensureTag({ github, context, version: process.env.VERSION });

      - name: Publish to npm
        if: steps.npm.outputs.published != 'true'
        env:
          PRERELEASE: ${{ steps.release.outputs.prerelease }}
        run: |
          if [ "$PRERELEASE" = "true" ]; then
            npm publish --access public --provenance --tag next
          else
            npm publish --access public --provenance
          fi

      - name: Create GitHub Release
        uses: actions/github-script@v8
        env:
          VERSION: ${{ steps.release.outputs.version }}
          PRERELEASE: ${{ steps.release.outputs.prerelease }}
        with:
          script: |
            const { ensureRelease } = require('./.github/scripts/release.cjs');
            const release = await ensureRelease({ github, context, version: process.env.VERSION,
              prerelease: process.env.PRERELEASE === 'true' });
            await core.summary.addHeading(`Published v${process.env.VERSION}`)
              .addLink('GitHub Release', release.html_url).write();
